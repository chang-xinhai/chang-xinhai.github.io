name: Get Citation Data

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated metrics (main branch only)
        type: boolean
        default: false
  schedule:
    # Daily at 16:17 Asia/Shanghai; avoid the busiest top-of-hour queue.
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: scholar-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install requirements
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Test parser and failure handling
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py' -v
      - name: Fetch profile metrics
        timeout-minutes: 2
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python -u google_scholar_crawler/main.py --output-dir "$RUNNER_TEMP/scholar-results"
      - name: Record successful metrics
        env:
          RESULTS_FILE: ${{ runner.temp }}/scholar-results/gs_data.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['RESULTS_FILE']).read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Google Scholar fetched successfully.\n\nCitations: {data['citedby']}\n\nH-index: {data['hindex']}\n\nUpdated: {data['updated']}\n")
          PY
      - name: Save validated results
        uses: actions/upload-artifact@v4
        with:
          name: scholar-metrics
          path: ${{ runner.temp }}/scholar-results/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Report failure without replacing published data
        if: failure()
        run: echo 'Scholar refresh failed. Published JSON and its last-success timestamp were left unchanged. Check the request status in the fetch step.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: google-scholar-stats
      - uses: actions/download-artifact@v4
        with:
          name: scholar-metrics
      - name: Publish citation data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Google Scholar profile metrics'
          git push origin HEAD:google-scholar-stats
